version: '3.8'

services:
  spark-master:
    image: apache/spark:3.5.1
    environment:
      - SPARK_MODE=master
    ports:
      - '8080:8080'
    command: /opt/spark/sbin/start-master.sh

  spark-worker:
    build:
      context: ./docker/spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./models:/opt/models:ro

  minio:
    image: minio/minio:latest
    command: server /data
    ports:
      - '9000:9000'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data

volumes:
  minio-data:

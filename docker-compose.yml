version: '3.8'

networks:
  tourism-net:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  trino_data:
  airflow_logs:

services:
  minio:
    build:
      context: ./docker/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - tourism-net
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    build:
      context: ./docker/postgres
    container_name: postgres
    environment:
      - POSTGRES_USER=tourism
      - POSTGRES_PASSWORD=tourism
      - POSTGRES_DB=tourism
    ports:
      - "5432:5432"
    networks:
      - tourism-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourism -d tourism"]
      interval: 30s
      timeout: 10s
      retries: 3

  spark-master:
    build:
      context: ./docker/spark
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - tourism-net
    depends_on:
      - minio
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  spark-worker:
    build:
      context: ./docker/spark-worker
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    networks:
      - tourism-net
    depends_on:
      - spark-master
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  trino:
    build:
      context: ./docker/trino
    container_name: trino
    environment:
      - TRINO_CATALOG=iceberg
    ports:
      - "8081:8080"
    networks:
      - tourism-net
    depends_on:
      - minio
    volumes:
      - minio_data:/minio:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow-init:
    build:
      context: ./docker/airflow
    container_name: airflow-init
    user: "root"
    environment:
      - AIRFLOW_UID=50000
      - AIRFLOW_GID=0
    command: ["airflow", "db", "init"]
    networks:
      - tourism-net
    depends_on:
      - postgres
    volumes:
      - ./airflow:/opt/airflow

  airflow-webserver:
    build:
      context: ./docker/airflow
    container_name: airflow-webserver
    user: "root"
    environment:
      - AIRFLOW_UID=50000
    ports:
      - "8082:8080"
    networks:
      - tourism-net
    depends_on:
      - airflow-init
    command: ["airflow", "webserver"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow-scheduler:
    build:
      context: ./docker/airflow
    container_name: airflow-scheduler
    user: "root"
    environment:
      - AIRFLOW_UID=50000
    networks:
      - tourism-net
    depends_on:
      - airflow-init
      - airflow-webserver
    command: ["airflow", "scheduler"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nlp:
    build:
      context: ./docker/nlp
    container_name: nlp
    environment:
      - MLFLOW_HOST=mlflow
      - MLFLOW_PORT=5000
    networks:
      - tourism-net
    volumes:
      - ./data/sample:/data:ro
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "python", "-c", "import torch; print(torch.__version__)"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: bitnami/mlflow:latest
    container_name: mlflow
    environment:
      - MLFLOW_BACKEND=sqlite
      - MLFLOW_SQLITE_DB_PATH=/mlflow/mlflow.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "5000:5000"
    networks:
      - tourism-net
    depends_on:
      - postgres
    volumes:
      - mlflow_data:/mlflow
version: "1.1.0"

text:
  lowercase: true
  use_underthesea: true
  use_clause_split: true
  min_clause_len: 5
  sentence_min_len: 3
  sentence_max_len: 512

segmentation:
  strategy: "hybrid"
  window_before: 6
  window_after: 6
  include_keyword: true
  dedupe_by_hash: true
  max_aspects_per_sentence: 6
  min_segment_len: 3
  keep_unmatched: true

negation:
  enabled: true
  strategy: "preserve_for_model"
  window_tokens: 3

quality:
  min_score: 0.3
  max_score: 1.0
  min_sentence_len: 3
  max_sentence_len: 512
  required_labels: ["negative", "neutral", "positive"]
  label_distribution_min_pct: 0.01
  max_aspects_per_sentence: 10

references:
  model: "configs/models/visobert.yaml"
  aspect_keywords: "configs/enrichment/sentiment/aspect_keywords.yaml"

# Sentiment Pipeline Configuration
# Pipeline version: 1.1.0

pipeline:
  output_root: "data/sentiment"
  raw_root: "data/raw"

model:
  name: "5CD-AI/Vietnamese-Sentiment-visobert"
  version: "visobert"
  local_dir: "models/visobert"
  batch_size: 32
  max_length: 256
  provider: "transformers"  # "transformers" | "stub"

text:
  lowercase: true
  use_underthesea: true
  # Clause split config (cho ABSA clause-level)
  use_clause_split: true
  min_clause_len: 5

quality:
  min_score: 0.3
  max_score: 1.0
  min_sentence_len: 3
  max_sentence_len: 512
  required_labels: ["negative", "neutral", "positive"]
  label_distribution_min_pct: 0.01

# Aspects configuration (ABSA)
aspects:
  enabled: false
  keywords_path: "configs/ingestion/aspect_keywords.yaml"
  granularity: "sentence"  # "sentence" | "clause"
  quality:
    min_aspect_coverage: 0.0
    required_aspects: []
    max_aspects_per_sentence: 10

# Spark config (cho chạy trên cluster)
spark:
  master: "local[*]"
  app_name: "tlcn-sentiment"
  executor_memory: "4g"
  driver_memory: "2g"
  default_parallelism: 4
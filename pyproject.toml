[project]
name = "travel-intelligence"
version = "0.1.0"
description = "Vietnam Travel Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "huggingface-hub==0.36.0",
    "minio==7.2.15",
    "pyarrow==25.0.1",
    "pyyaml==6.0.2",
    "rfc8785==0.1.4",
    "safetensors==0.7.0",
    "sentence-transformers==3.4.1",
    "torch==2.12.0",
    "transformers==4.41.2",
    "trino==0.340.0",
    "underthesea==9.5.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]


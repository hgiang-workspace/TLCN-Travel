name: travel-lakehouse-g01

services:
  postgres:
    image: postgres:16.10-alpine3.22
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: ${ICEBERG_DB_USER:?ICEBERG_DB_USER is required}
      POSTGRES_PASSWORD: ${ICEBERG_DB_PASSWORD:?ICEBERG_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  minio-volume-init:
    image: alpine:3.22.1
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown 100:101 /data
        stat -c 'MinIO volume ownership: %u:%g mode=%a path=%n' /data
    volumes:
      - minio_data:/data

  minio:
    image: travel-lakehouse/minio:RELEASE.2025-10-15T17-29-55Z
    user: "100:101"
    build:
      context: ../..
      dockerfile: infra/minio/Dockerfile.server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
    - "9000:9000"  # S3 API
    - "9001:9001"  # MinIO Console UI
    volumes:
      - minio_data:/data
    depends_on:
      minio-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped

  minio-bootstrap:
    image: travel-lakehouse/mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: ../..
      dockerfile: infra/minio/Dockerfile.client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/travel-lakehouse
        mc stat local/travel-lakehouse

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  trino:
    image: trinodb/trino:484
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      ICEBERG_DB_USER: ${ICEBERG_DB_USER:?ICEBERG_DB_USER is required}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:?ICEBERG_DB_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ../trino/config.properties:/etc/trino/config.properties:ro
      - ../trino/node.properties:/etc/trino/node.properties:ro
      - ../trino/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  spark-events-init:
    image: alpine:3.22.1
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown 185:185 /spark-events
        stat -c 'Spark event volume ownership: %u:%g mode=%a path=%n' /spark-events
    volumes:
      - spark_events:/spark-events

  spark-history-server:
    image: travel-lakehouse-g01-spark:latest
    build:
      context: ../..
      dockerfile: infra/spark/Dockerfile
    user: "185:185"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: -Dspark.history.fs.logDirectory=file:///opt/spark-events
    volumes:
      - spark_events:/opt/spark-events
      - ../spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      spark-events-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/v1/applications"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:18080:18080"
    restart: unless-stopped

  spark:
    image: travel-lakehouse-g01-spark:latest
    build:
      context: ../..
      dockerfile: infra/spark/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      spark-events-init:
        condition: service_completed_successfully
    environment:
      ICEBERG_DB_USER: ${ICEBERG_DB_USER:?ICEBERG_DB_USER is required}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:?ICEBERG_DB_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      AWS_REGION: us-east-1
    volumes:
      - spark_events:/opt/spark-events
      - ../spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    entrypoint: ["/opt/entrypoint.sh", "driver", "/opt/g01/spark_iceberg_smoke.py"]
    profiles: ["jobs"]

volumes:
  minio_data:
  postgres_data:
  spark_events:
  qdrant_data:
